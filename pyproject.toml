[project]
name = "mercado-nube-platform"
version = "0.1.0"
description = "Plataforma de datos analítica en AWS y Local para Mercado Nube (Cohorte 5 Avanzado AWS)"
authors = [
    { name = "Jayzir Martinez", email = "jayzirslaider18@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10.0",
    "pandas>=2.1.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.9",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
